[project]
name = "otpgrep"
version = "0.1.0"
description = "Extract a one-time login code from message text"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
otpgrep = "otpgrep:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.14"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "otpgrep"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
